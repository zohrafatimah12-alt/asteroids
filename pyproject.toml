[project]
name = "asteroids"
version = "0.1.0"
description = "NEBULA: a strategy and air-combat game grown from Asteroids"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pandas>=3.1.1",
    "pygame==2.6.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
